    <base href="../" />
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>

    <link rel="preload" href="https://static.igem.wiki/teams/6112/wiki/betterfonts/fredoka-regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="https://static.igem.wiki/teams/6112/wiki/betterfonts/varelaround-regular.ttf" as="font" type="font/ttf" crossorigin>

  </head>
  <body class="wiki-interior" data-page-family="research">
    <div id="scroll-progress"></div>
    <div id="nav"></div>

    <main>
      <div class="page-hero">
        <div class="container"><div class="chapter-intro">
          <h1>Binder Viewer</h1>
          <p class="summary draft-summary">--</p>
        </div></div>
      </div>

      <div class="page-content">
        <div class="container binder-page-container">

          <section class="wiki-section" id="viewer">
            <h3><span class="chapter-number" aria-hidden="true">01</span><span>Interactive Structure Viewer</span></h3>
            <div class="binder-viewer-layout">
              <div class="binder-sidebar section-block">
                <span class="section-block-label">Structures</span>
                <div id="binder-tabs" class="binder-tabs"></div>
                <div id="binder-list" class="binder-list"></div>
                <p id="binder-empty" class="binder-empty-msg" hidden>No structures have been added yet — check back soon.</p>
              </div>
              <div class="binder-main">
                <div id="binder-molstar-app" class="binder-molstar-card"></div>
                <div id="binder-detail" class="section-block"></div>
              </div>
            </div>
          </section>

        </div>
      </div>
    </main>

    <div id="footer"></div>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
      <span id="theme-toggle-icon" aria-hidden="true"></span>
    </button>
    <a id="back-to-top" href="#" aria-label="Back to top">&#8679;</a>
    <script src="static/cursor.js"></script>
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;

        function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

        function sync() {
          var dark = isDark();
          btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
          btn.setAttribute('title', dark ? 'Switch to light mode' : 'Switch to dark mode');
        }

        btn.addEventListener('click', function () {
          var dark = !isDark();
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          localStorage.setItem('theme', dark ? 'dark' : 'light');
          sync();
        });

        sync();
      })();
    </script>
    <script src="static/include.js"></script>
    
    <script src="static/molstar/molstar.js"></script>
    <script src="static/binder-viewer.js"></script>
  </body>
