    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;

        function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

        function sync() {
          var dark = isDark();
          btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
          btn.setAttribute('title', dark ? 'Switch to light mode' : 'Switch to dark mode');
        }

        btn.addEventListener('click', function () {
          var dark = !isDark();
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          localStorage.setItem('theme', dark ? 'dark' : 'light');
          sync();
        });

        sync();
      })();
    </script>
    <script>
      (function () {
        var rosterImages = document.querySelectorAll('.roster-image[data-light-src][data-dark-src]');
        if (!rosterImages.length) return;

        function applyRosterTheme() {
          var dark = document.documentElement.getAttribute('data-theme') === 'dark';
          rosterImages.forEach(function (img) {
            var src = dark ? img.getAttribute('data-dark-src') : img.getAttribute('data-light-src');
            if (img.getAttribute('src') !== src) img.setAttribute('src', src);
          });
        }

        var themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) themeToggleBtn.addEventListener('click', applyRosterTheme);

        applyRosterTheme();
      })();
    </script>

    <!-- Bio Modal -->
    <div id="bio-modal" class="bio-modal">
      <div class="bio-modal-content">
        <button class="bio-modal-close" aria-label="Close bio">&times;</button>
        <div id="bio-modal-photo-wrap"></div>
        <h3 id="bio-modal-name"></h3>
        <p id="bio-modal-role" class="bio-modal-role"></p>
        <p id="bio-modal-text"></p>
      </div>
    </div>

    <script>
      const bioModal = document.getElementById('bio-modal');
      const bioModalName = document.getElementById('bio-modal-name');
      const bioModalRole = document.getElementById('bio-modal-role');
      const bioModalText = document.getElementById('bio-modal-text');
      const bioModalPhotoWrap = document.getElementById('bio-modal-photo-wrap');
      const closeBtn = document.querySelector('.bio-modal-close');

      function openModal(name, role, bio, imgEl) {
        bioModalName.textContent = name || '';
        bioModalRole.textContent = role || '';
        bioModalText.textContent = bio || '';
        bioModalPhotoWrap.innerHTML = '';
        if (imgEl && imgEl.src) {
          const photo = document.createElement('img');
          photo.src = imgEl.src;
          photo.alt = name;
          photo.className = 'bio-modal-photo';
          bioModalPhotoWrap.appendChild(photo);
        } else {
          const placeholder = document.createElement('div');
          placeholder.className = 'bio-modal-placeholder';
          bioModalPhotoWrap.appendChild(placeholder);
        }
        bioModal.classList.add('active');
      }

      document.querySelectorAll('.roster-hotspot').forEach(hotspot => {
        hotspot.addEventListener('click', () => {
          const imgSrc = hotspot.getAttribute('data-img');
          openModal(
            hotspot.getAttribute('data-name'),
            hotspot.getAttribute('data-role'),
            hotspot.getAttribute('data-bio'),
            imgSrc ? { src: imgSrc } : null
          );
        });
      });

      closeBtn.addEventListener('click', () => bioModal.classList.remove('active'));
      bioModal.addEventListener('click', e => { if (e.target === bioModal) bioModal.classList.remove('active'); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') bioModal.classList.remove('active'); });
    </script>
